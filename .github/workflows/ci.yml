name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes (unitários, integração e arquitetura)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Imagem no Docker Hub
    needs: test
    # em pull request só testa; a imagem é publicada a partir da main
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Confere se os secrets do Docker Hub existem
        id: secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN não configurados. A imagem não foi publicada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.secrets.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.secrets.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        if: steps.secrets.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-bff:v1
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-bff:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pjbl-bff:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
